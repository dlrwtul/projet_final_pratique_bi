version: 2

models:
  - name: stg_customers
    description: "Clients nettoyés"
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
  - name: stg_order_lines
    columns:
      - name: order_line_id
        data_tests: [unique, not_null]
  - name: stg_stock_items
    columns:
      - name: stock_item_id
        data_tests: [unique, not_null]
  - name: stg_people
    columns:
      - name: person_id
        data_tests: [unique, not_null]