[project]
name = "projet_final_pratique_bi"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "bcrypt>=5.0.0",
    "dagster==1.13.17",
    "dagster-dbt>=0.29.17",
    "dagster-dlt>=0.29.17",
    "dbt-core>=1.11.13",
    "dbt-duckdb>=1.11.0",
    "dbt-snowflake>=1.12.0",
    "dlt[duckdb,mssql,snowflake]>=1.30.0",
    "pandas>=2.3.3",
    "pymssql>=2.3.13",
    "pyodbc>=5.3.0",
    "snowflake-connector-python>=4.7.2",
    "streamlit>=1.65.0",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "projet_final_pratique_bi"
registry_modules = [
    "projet_final_pratique_bi.components.*",
]


